<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Генератор SIM-карт</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--dim:#6b6b73;--acc:#3834FF;--ink:#F3F3F3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0}
body{background:#000;color:var(--ink);font-family:"Chakra Petch","Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:manipulation}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
background-image:linear-gradient(var(--acc) 1.2px,transparent 1.2px),linear-gradient(90deg,var(--acc) 1.2px,transparent 1.2px);
background-size:26px 26px;opacity:.045}
#app{height:100%;display:flex;flex-direction:column;position:relative;z-index:1;max-width:480px;margin:0 auto;width:100%}
@media(min-width:560px){body{background:#050507}#app{border-left:1px solid #15151b;border-right:1px solid #15151b}}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
#menu{width:46px;height:46px;border-radius:14px;border:1px solid #26262c;background:#0a0a0c;display:grid;place-content:center;gap:5px;flex:none}
#menu i{display:block;width:20px;height:2px;background:#ddd;border-radius:2px}
#lvl{flex:1;min-width:0}
#lvl .lt{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:4px}
#lvl .lt b{color:var(--acc);font-size:13px}
#xpb{height:5px;border-radius:99px;background:#141419;overflow:hidden}
#xpf{height:100%;border-radius:99px;background:linear-gradient(90deg,#030FC6,var(--acc));box-shadow:0 0 8px var(--acc);transition:width .4s}
.bal{text-align:right;font-weight:700;font-size:17px;line-height:1.3;flex:none;font-variant-numeric:tabular-nums}
.bal small{display:block;color:#ffc94d;font-size:14px}
.bal .bst{color:#3ddc84;font-size:12px}
#snd{position:absolute;right:14px;top:64px;width:34px;height:34px;border-radius:10px;border:1px solid #26262c;background:#0a0a0c;font-size:15px;display:grid;place-content:center;z-index:2}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:12px 18px;position:relative}
#hint{color:#4d4d55;font-size:15px;animation:pulse 2.2s ease-in-out infinite;text-align:center;line-height:1.5}
@keyframes pulse{50%{opacity:.35}}
#combo{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-weight:700;font-size:14px;color:#ff3d7f;text-shadow:0 0 14px #ff3d7f;opacity:0;transition:opacity .3s;white-space:nowrap}
#combo.on{opacity:1;animation:cpop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes cpop{0%{transform:translateX(-50%) scale(.5)}100%{transform:translateX(-50%) scale(1)}}
.card{--c:#9aa0a6;display:none;width:min(100%,340px);padding:20px 20px 18px;border-radius:22px 22px 22px 46px;
border:1.5px solid transparent;
background:linear-gradient(160deg,#17171c,#08080a) padding-box,linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 22%,#000) 55%,var(--c)) border-box;
box-shadow:0 0 30px -8px var(--c),0 14px 34px rgba(0,0,0,.7)}
.card.show{display:block;animation:drop .55s cubic-bezier(.2,1.25,.4,1)}
@keyframes drop{from{opacity:0;transform:translateY(-110px) rotate(-7deg) scale(.85)}to{opacity:1;transform:none}}
.card.legendary.show,.card.mythic.show{position:relative;overflow:hidden;animation:landing .9s cubic-bezier(.2,1.2,.3,1),glow 1.6s ease-in-out .9s infinite;background:linear-gradient(160deg,#2a1c05,#0a0703) padding-box,linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 22%,#000) 55%,var(--c)) border-box}
.card.mythic.show{background:linear-gradient(160deg,#2a0716,#0a0307) padding-box,linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 22%,#000) 55%,var(--c)) border-box}
@keyframes landing{0%{opacity:0;transform:translateY(-180px) scale(2.2) rotate(-12deg)}55%{opacity:1;transform:translateY(8px) scale(.96) rotate(2deg)}75%{transform:scale(1.03)}100%{opacity:1;transform:none}}
.card.legendary.show::after,.card.mythic.show::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,235,170,.4) 50%,transparent 65%);transform:translateX(-130%);animation:shine 2.4s ease-in-out .9s infinite;pointer-events:none}
@keyframes shine{60%,100%{transform:translateX(130%)}}
.card.epic.show{animation:drop .55s cubic-bezier(.2,1.25,.4,1),glow 2.4s ease-in-out .55s infinite}
@keyframes glow{50%{box-shadow:0 0 64px 4px var(--c),0 14px 34px rgba(0,0,0,.7)}}
.card.crit{outline:2px dashed #ffe14d;outline-offset:5px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.chip{width:46px;height:34px;border-radius:7px;background:linear-gradient(135deg,#f0d27a,#a9790c);position:relative;overflow:hidden}
.chip::before{content:'';position:absolute;inset:6px 4px;border:1px solid rgba(0,0,0,.35);border-radius:4px;border-top:none}
.tag{padding:4px 11px;border-radius:99px;background:var(--c);color:#000;font-weight:700;font-size:13px}
.op{color:var(--dim);font-size:15px}
.num{font-weight:700;font-size:clamp(19px,6.2vw,27px);margin:4px 0 12px;white-space:nowrap;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.cat{color:#c4c4cc;font-size:15px}
.price{margin-top:8px;font-weight:700;font-size:24px;color:var(--c);font-variant-numeric:tabular-nums}
.price .cr{color:#ffe14d;font-size:15px;margin-left:8px}
.note{margin-top:10px;font-size:14px;color:var(--dim);line-height:1.45}
#fx{position:fixed;inset:0;z-index:4;pointer-events:none;overflow:hidden;display:none}
#fx.go{display:block}
.flash{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at 50% 45%,#fff 0,var(--fc) 35%,transparent 70%);animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:var(--fo,.95)}100%{opacity:0}}
.rays{position:absolute;left:50%;top:45%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;opacity:0;background:repeating-conic-gradient(color-mix(in srgb,var(--fc) 40%,transparent) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);animation:rays 2.8s ease-out}
@keyframes rays{0%{opacity:0;transform:rotate(0) scale(.4)}15%{opacity:1}100%{opacity:0;transform:rotate(50deg) scale(1)}}
#fx i{position:absolute;left:50%;top:45%;width:var(--s);height:var(--s);border-radius:50%;background:var(--fc);box-shadow:0 0 10px 2px var(--fc);opacity:0;animation:burst var(--t) cubic-bezier(.1,.7,.3,1) forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 60px))}}
.ft{position:absolute;left:0;right:0;top:14%;text-align:center;font-weight:700;font-size:clamp(24px,8vw,38px);color:var(--fc);text-shadow:0 0 24px var(--fc);opacity:0;animation:ft 2.6s ease-out}
@keyframes ft{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,-3px)}80%{transform:translate(3px,4px)}}
#bar{display:flex;gap:10px;margin:0 16px 16px}
#bar button{flex:1;padding:15px 8px;border-radius:16px;border:1px solid #26262c;background:#0a0a0c;font-weight:600;font-size:15px}
#bar button:active{border-color:var(--acc)}
#inv,#mnu,#scr{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:radial-gradient(120% 90% at 50% 0%,#0c0c14 0,#000 55%);transform:translateX(-102%);transition:transform .28s;max-width:480px;margin:0 auto}
#inv.open,#mnu.open,#scr.open{transform:none}
.ih{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #22222a;background:linear-gradient(180deg,#0d0d13,rgba(0,0,0,0))}
.ih h2{flex:1;margin:0;font-size:20px;background:linear-gradient(90deg,#fff,#8f8bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.ih button,.row button{padding:9px 14px;border-radius:12px;border:1px solid #2c2c33;background:#0e0e11;font-size:14px}
#invF{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid #1c1c21}
#invF span{flex:1;min-width:0;color:var(--dim);font-size:13px;line-height:1.4}
#invF button{padding:11px 16px;border-radius:12px;border:1px solid #3ddc84;background:#0b1a12;color:#3ddc84;font-weight:700;font-size:14px;flex:none}
#invF button:disabled{opacity:.35;border-color:#2c2c33;background:#0e0e11;color:var(--dim)}
.sel{width:22px;height:22px;accent-color:#3ddc84;flex:none;cursor:pointer}
.rw{flex:1;min-width:0}
.bshop{color:#3ddc84;font-size:12px;font-weight:700}
#list,#sL{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.row{--c:#999;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;border:1px solid #1c1c21;border-left:4px solid var(--c);background:linear-gradient(135deg,#0d0d12,#09090c)}
.rn{font-weight:700;font-size:17px}
.rs{color:var(--dim);font-size:13px;margin-top:2px;line-height:1.45}
.rp{color:var(--c);font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.empty{color:var(--dim);text-align:center;margin-top:40px;line-height:1.6}
.mi{display:flex;flex-direction:column;gap:12px;padding:16px;overflow-y:auto}
.mi button{--mc:#3834FF;position:relative;display:flex;align-items:center;padding:14px 16px;border-radius:18px;border:1px solid #23232b;background:linear-gradient(135deg,#0e0e14,#08080b);font-size:18px;font-weight:700;text-align:left;gap:12px;transition:transform .12s,border-color .2s,box-shadow .2s}
.mi button::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:99px;background:var(--mc);box-shadow:0 0 12px var(--mc);opacity:.85}
.mi button:active{transform:scale(.97);border-color:var(--mc);box-shadow:0 0 24px -8px var(--mc)}
.mi .ic{width:46px;height:46px;border-radius:14px;display:grid;place-content:center;font-size:21px;flex:none;background:color-mix(in srgb,var(--mc) 15%,#0a0a0c);border:1px solid color-mix(in srgb,var(--mc) 38%,transparent)}
.mi .mt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mi small{color:var(--dim);font-size:13px;font-weight:400;text-align:left}
.mi .arr{color:#3a3a44;font-size:22px;font-weight:400;flex:none}
.mBal{display:flex;justify-content:space-between;gap:8px;padding:14px 18px;margin-top:auto;border-top:1px solid #1c1c21;color:#9a9aa5;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.lv{color:var(--dim);font-size:13px;font-weight:400}
.row button:disabled{opacity:.35;cursor:default}
.sf{display:flex;flex-direction:column;gap:10px}
.sf select,.sf input{width:100%;padding:14px;border-radius:14px;border:1px solid #26262c;background:#0a0a0c;color:var(--ink);font:inherit;font-size:17px}
.sf input{font-size:22px;font-weight:700;letter-spacing:.08em;text-align:center}
input,select{user-select:text;-webkit-user-select:text}
.hint{color:var(--dim);text-align:center;line-height:1.5;margin:14px 0}
#toasts{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{--tc:#3ddc84;max-width:min(92vw,420px);padding:11px 18px;border-radius:14px;border:1px solid color-mix(in srgb,var(--tc) 55%,transparent);background:#0b0b0df2;color:var(--ink);font-size:14px;font-weight:600;box-shadow:0 0 22px -6px var(--tc);animation:tin .35s cubic-bezier(.2,1.4,.4,1),tout .4s ease-in 3.2s forwards;text-align:center;line-height:1.4}
.toast b{color:var(--tc)}
@keyframes tin{from{opacity:0;transform:translateY(18px) scale(.9)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
.achG{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ach{padding:12px;border-radius:14px;border:1px solid #1c1c21;background:#0b0b0d;opacity:.45}
.ach.got{opacity:1;border-color:#ffb02055;box-shadow:0 0 18px -8px #ffb020}
.ach .an{font-weight:700;font-size:14px}
.ach .ad{color:var(--dim);font-size:12px;margin-top:3px;line-height:1.4}
.ach .ar{color:#ffc94d;font-size:12px;margin-top:4px;font-weight:700}
.dexC{--c:#555;padding:11px 14px;border-radius:14px;border:1px solid #1c1c21;border-left:4px solid var(--c);background:#0b0b0d;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dexC.miss{opacity:.35}
.dexC b{font-size:14px}
.dexC span{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.stR{display:flex;justify-content:space-between;padding:13px 16px;border-radius:14px;border:1px solid #1c1c21;background:#0b0b0d;font-size:15px}
.stR b{color:var(--acc);font-variant-numeric:tabular-nums}
.progT{text-align:center;color:var(--dim);font-size:14px;margin:2px 0 4px}
.progB{height:8px;border-radius:99px;background:#141419;overflow:hidden}
.progF{height:100%;background:linear-gradient(90deg,#030FC6,var(--acc));box-shadow:0 0 10px var(--acc);border-radius:99px}
.bty{margin-top:6px;color:#ffc94d;font-size:14px;letter-spacing:.06em}
.bty span{color:var(--dim);font-size:12px;letter-spacing:0}
.bStar{color:#ffc94d;font-size:11px;letter-spacing:.03em}
.upSegs{display:flex;gap:3px;margin-top:7px;flex-wrap:wrap}
.upSegs i{width:14px;height:5px;border-radius:99px;background:#1c1c22;transition:background .3s}
.upSegs i.r{background:#3a2f12}
.upSegs i.u{background:#123324}
.upSegs i.on.r{background:#ffb020;box-shadow:0 0 7px #ffb020}
.upSegs i.on.u{background:#3ddc84;box-shadow:0 0 7px #3ddc84}
.upCur{color:#55555e;font-size:11px;margin-top:5px}
.capBar{height:6px;border-radius:99px;background:#141419;overflow:hidden;margin:0 0 4px}
.capBar i{display:block;height:100%;border-radius:99px;background:#3ddc84;transition:width .4s,background .3s}
.capBar.warn i{background:#ffb020}.capBar.full i{background:#ff3d7f}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== LIVE UI / TILE MENU v2 ===== */
body::after{content:'';position:fixed;inset:-25%;pointer-events:none;z-index:0;background:radial-gradient(circle at 20% 20%,rgba(61,139,255,.13),transparent 24%),radial-gradient(circle at 80% 35%,rgba(180,77,255,.10),transparent 22%),radial-gradient(circle at 45% 90%,rgba(61,220,132,.07),transparent 25%);filter:blur(28px);animation:ambient 14s ease-in-out infinite alternate}
@keyframes ambient{0%{transform:translate3d(-2%,0,0) scale(1)}100%{transform:translate3d(3%,-2%,0) scale(1.08)}}
#app{background:linear-gradient(180deg,rgba(8,8,12,.42),rgba(0,0,0,.05));backdrop-filter:blur(2px)}
header{position:relative}
header:after{content:'';position:absolute;left:14px;right:14px;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#252532,transparent);opacity:.8}
#menu{position:relative;overflow:hidden;transition:transform .18s,border-color .25s,background .25s}
#menu:before{content:'';position:absolute;width:34px;height:34px;left:-40px;top:-8px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);transform:rotate(25deg);animation:menuShine 4.5s infinite}
#menu:active{transform:scale(.92)}
@keyframes menuShine{0%,70%{left:-45px}100%{left:65px}}
#card{transition:transform .35s cubic-bezier(.2,.9,.25,1),filter .35s}
#card:hover{transform:translateY(-4px) rotateX(2deg)}
#bar button{position:relative;overflow:hidden;transition:transform .15s,border-color .2s,background .2s}
#bar button:after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.08) 50%,transparent 75%);transform:translateX(-120%);transition:transform .5s}
#bar button:hover:after,#bar button:focus-visible:after{transform:translateX(120%)}
#bar button:active{transform:scale(.96)}
#mnu{background:radial-gradient(120% 60% at 50% -10%,#17172a 0,#09090d 42%,#000 78%);}
#mnu .ih{padding:18px 16px 14px;background:linear-gradient(180deg,rgba(20,20,31,.95),rgba(8,8,12,.5));border-bottom:1px solid #20202b}
#mnu .ih h2{font-size:25px;letter-spacing:-.03em;background:linear-gradient(90deg,#fff 20%,#8d8aff 75%,#ff4d91);-webkit-background-clip:text;background-clip:text}
#mnu .ih h2:after{content:'  // CONTROL CENTER';display:inline-block;color:#555564;font-size:9px;letter-spacing:.12em;vertical-align:middle;margin-left:7px}
.mi{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;align-content:start}
.mi button{min-height:132px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:15px;border-radius:22px;border:1px solid rgba(255,255,255,.075);background:linear-gradient(145deg,rgba(22,22,30,.96),rgba(8,8,12,.98));box-shadow:inset 0 1px 0 rgba(255,255,255,.035),0 10px 30px rgba(0,0,0,.18);gap:8px;overflow:hidden;isolation:isolate}
.mi button:nth-child(1),.mi button:nth-child(3){background:linear-gradient(145deg,rgba(19,28,29,.98),rgba(8,10,12,.98))}
.mi button:nth-child(2){background:linear-gradient(145deg,rgba(31,25,15,.98),rgba(10,9,8,.98))}
.mi button:nth-child(4),.mi button:nth-child(6){background:linear-gradient(145deg,rgba(27,21,35,.98),rgba(9,8,12,.98))}
.mi button:nth-child(5){background:linear-gradient(145deg,rgba(34,17,27,.98),rgba(10,8,11,.98))}
.mi button:nth-child(7){background:linear-gradient(145deg,rgba(32,28,14,.98),rgba(10,9,7,.98))}
.mi button:nth-child(8){background:linear-gradient(145deg,rgba(25,25,29,.98),rgba(8,8,10,.98))}
.mi button:before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 100% 0,color-mix(in srgb,var(--mc) 22%,transparent),transparent 42%);opacity:.75}
.mi button:after{content:'';position:absolute;width:90px;height:90px;right:-42px;bottom:-42px;border-radius:50%;border:1px solid color-mix(in srgb,var(--mc) 35%,transparent);box-shadow:0 0 35px color-mix(in srgb,var(--mc) 16%,transparent);opacity:.55;transition:transform .35s}
.mi button:hover:after,.mi button:active:after{transform:scale(1.5)}
.mi button:active{transform:translateY(2px) scale(.975);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 4px 15px rgba(0,0,0,.25)}
.mi .ic{width:42px;height:42px;border-radius:14px;font-size:20px;background:color-mix(in srgb,var(--mc) 13%,#0b0b10);border:1px solid color-mix(in srgb,var(--mc) 35%,transparent);box-shadow:0 5px 18px color-mix(in srgb,var(--mc) 12%,transparent)}
.mi .mt{width:100%;gap:4px;line-height:1.12;font-size:16px;letter-spacing:-.015em}
.mi .mt small{font-size:11px;color:#686873;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .arr{position:absolute;right:14px;top:15px;width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.045);color:#777783;font-size:16px;transition:.2s}
.mi button:hover .arr{color:var(--mc);background:color-mix(in srgb,var(--mc) 12%,transparent);transform:translateX(2px)}
.mi .mBal{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:1px;padding:11px 12px;border:1px solid #1d1d25;border-radius:17px;background:rgba(12,12,16,.85);font-size:11px;color:#74747e;text-align:center;box-shadow:inset 0 1px rgba(255,255,255,.025)}
.mi .mBal span{padding:4px 2px;border-right:1px solid #1e1e25}.mi .mBal span:last-child{border-right:0}

/* плитка «Настройки» — занимает 2 ячейки */
.mi button.wide{grid-column:1/-1;min-height:84px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;background:linear-gradient(145deg,rgba(24,24,40,.98),rgba(9,9,14,.98))}
.mi button.wide .mt{width:auto;flex:1}
.mi button.wide .mt small{white-space:normal}
/* экран настроек */
.st{display:flex;flex-direction:column;gap:12px}
.st .sr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border:1px solid #23232b;border-radius:16px;background:linear-gradient(145deg,#12121a,#09090c);text-align:left}
.st .sr b{font-size:15px}.st .sr small{display:block;color:var(--dim);font-size:12px;font-weight:400;margin-top:3px}
.st .sw{width:52px;height:30px;border-radius:99px;border:1px solid #2c2c36;background:#15151b;position:relative;flex:none;padding:0}
.st .sw:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#6b6b78;transition:.2s}
.st .sw.on{background:#1f5a3c;border-color:#3ddc84}.st .sw.on:after{left:25px;background:#fff}
.st .col{flex-direction:column;align-items:stretch}
.st input[type=range]{width:100%;accent-color:#8d8aff}
.st textarea{width:100%;min-height:84px;padding:10px;border-radius:12px;border:1px solid #26262c;background:#0a0a0c;color:var(--ink);font:12px/1.35 monospace;resize:vertical;user-select:text;-webkit-user-select:text}
.st .btn{padding:13px;border-radius:14px;border:1px solid #2c2c36;background:#12121a;color:var(--ink);font:inherit;font-weight:700}
.st .btn.red{border-color:#7a2a3d;color:#ff6b8b}
.st .two{display:flex;gap:8px}.st .two .btn{flex:1}
@media(max-width:360px){.mi{gap:9px;padding:12px}.mi button{min-height:122px;padding:12px}.mi .mt{font-size:14px}}
@media(min-width:560px){#mnu{border-left:1px solid #191922;border-right:1px solid #191922}}

/* ===== VISUAL POLISH v3 ===== */
:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--line:rgba(255,255,255,.08);--dim:#7c7c8a;--glass:linear-gradient(145deg,rgba(26,26,38,.85),rgba(9,9,14,.92))}
body{background:radial-gradient(90% 55% at 50% -8%,#11123f 0,#05050b 58%,#000 100%) fixed}
body::before{opacity:.055;-webkit-mask:radial-gradient(ellipse at 50% 40%,#000 0,transparent 75%);mask:radial-gradient(ellipse at 50% 40%,#000 0,transparent 75%);animation:gridDrift 26s linear infinite}
@keyframes gridDrift{to{background-position:26px 26px}}
main::before{content:'';position:absolute;z-index:-1;left:50%;top:44%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(circle,rgba(70,66,255,.2),transparent 65%);filter:blur(12px);pointer-events:none;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.18);opacity:.65}}
header{padding:14px 14px 12px}
#menu,#snd{background:var(--glass);border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.45)}
#menu{border-radius:15px}
#menu i{background:#e8e8f4;transition:width .3s var(--ease),transform .3s var(--ease)}
#menu:hover i:nth-child(2){width:13px}
#snd{transition:transform .25s var(--spring)}#snd:active{transform:scale(.85) rotate(-12deg)}
#lvl .lt b{padding:1px 9px;border-radius:99px;background:rgba(56,52,255,.15);border:1px solid rgba(93,90,255,.38);color:#aeabff}
#xpb{height:7px;background:#11111a;box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
#xpf{position:relative;overflow:hidden;transition:width .8s var(--ease);background:linear-gradient(90deg,#1a1fe0,#5d5aff 60%,#9d90ff);box-shadow:0 0 12px rgba(80,76,255,.85)}
#xpf::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:xpShine 3.2s ease-in-out infinite}
@keyframes xpShine{60%,100%{transform:translateX(100%)}}
#rub,#usd{transform-origin:100% 50%;transition:transform .3s var(--spring),filter .3s}
#rub{display:inline-block;background:linear-gradient(180deg,#fff,#c9caff);-webkit-background-clip:text;background-clip:text;color:transparent}
#rub.bump,#usd.bump{transform:scale(1.07);filter:drop-shadow(0 0 8px rgba(120,255,190,.7))}
#combo{top:4px;padding:6px 14px;border-radius:99px;background:linear-gradient(90deg,rgba(255,61,127,.2),rgba(255,176,32,.14));border:1px solid rgba(255,61,127,.45);box-shadow:0 0 24px -6px #ff3d7f;backdrop-filter:blur(8px);transition:opacity .4s var(--ease)}
@keyframes cpop{0%{transform:translateX(-50%) scale(.4)}60%{transform:translateX(-50%) scale(1.14)}100%{transform:translateX(-50%) scale(1)}}
#hint{position:relative;padding-top:46px;color:#6c6c7b;letter-spacing:.02em}
#hint::before{content:'';position:absolute;left:50%;top:0;width:32px;height:32px;margin-left:-16px;border-radius:50%;border:2px solid rgba(93,90,255,.6);box-shadow:0 0 20px rgba(56,52,255,.45),inset 0 0 12px rgba(56,52,255,.35);animation:tapRing 2.2s var(--ease) infinite}
#hint::after{content:'';position:absolute;left:50%;top:11px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#8582ff;box-shadow:0 0 14px #5d5aff}
@keyframes tapRing{0%{transform:scale(.6);opacity:.95}100%{transform:scale(1.8);opacity:0}}
.card{position:relative;overflow:hidden;padding:22px 20px 18px;transform-style:preserve-3d;
background:linear-gradient(160deg,#1b1b24,#09090c) padding-box,linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 18%,#000) 50%,var(--c)) border-box;
box-shadow:0 0 38px -10px var(--c),0 22px 44px -8px rgba(0,0,0,.78),inset 0 1px 0 rgba(255,255,255,.06)}
.card>*{position:relative;z-index:1}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 70% at 0% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 55%),repeating-linear-gradient(115deg,transparent 0 14px,rgba(255,255,255,.02) 14px 15px)}
.card.show::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.17) 50%,transparent 62%);transform:translateX(-130%);animation:sweep 1.1s var(--ease) .25s 1 forwards}
@keyframes sweep{to{transform:translateX(130%)}}
#card{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s var(--ease)}
#card:hover{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px)}
@keyframes drop{0%{opacity:0;transform:translateY(-90px) rotate(-6deg) scale(.86);filter:blur(6px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes landing{0%{opacity:0;transform:translateY(-200px) scale(2.1) rotate(-10deg);filter:blur(10px)}55%{opacity:1;transform:translateY(10px) scale(.96) rotate(2deg);filter:blur(0)}78%{transform:scale(1.03)}100%{opacity:1;transform:none}}
@keyframes glow{50%{box-shadow:0 0 72px 2px var(--c),0 22px 44px -8px rgba(0,0,0,.78)}}
.chip{background:linear-gradient(135deg,#f8e09a,#b8860b 55%,#ecc860);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 8px rgba(0,0,0,.45)}
.chip::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(0,0,0,.28)}
.tag{padding:5px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#fff));box-shadow:0 0 16px -2px var(--c)}
.num{font-size:clamp(20px,6.4vw,28px);background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--c) 40%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 50%,transparent))}
.price{font-size:26px;text-shadow:0 0 18px color-mix(in srgb,var(--c) 45%,transparent)}
.bty{text-shadow:0 0 10px rgba(255,201,77,.5)}
.note{padding-top:10px;border-top:1px dashed rgba(255,255,255,.1)}
#bar{gap:10px}
#bar button{padding:14px 8px;border-radius:18px;background:var(--glass);border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 20px -10px rgba(0,0,0,.85);transition:transform .25s var(--spring),border-color .25s,box-shadow .25s}
#bar button:hover{border-color:rgba(93,90,255,.5);box-shadow:0 0 24px -8px var(--acc),inset 0 1px 0 rgba(255,255,255,.06)}
#inv,#mnu,#scr{visibility:hidden;transition:transform .5s var(--ease),visibility 0s linear .5s}
#inv.open,#mnu.open,#scr.open{visibility:visible;transition:transform .5s var(--ease),visibility 0s}
.ih{position:sticky;top:0;z-index:2;backdrop-filter:blur(14px)}
.ih button,.row button{border-radius:13px;border-color:var(--line);background:linear-gradient(145deg,#1a1a24,#0c0c12);font-weight:600;transition:transform .2s var(--spring),border-color .2s,box-shadow .2s}
.ih button:active,.row button:active,#invF button:active{transform:scale(.93)}
.row button:not(:disabled){border-color:color-mix(in srgb,var(--c) 50%,transparent)}
.row button:not(:disabled):hover{box-shadow:0 0 18px -6px var(--c)}
#invF{background:linear-gradient(0deg,rgba(10,10,16,.95),transparent);backdrop-filter:blur(10px)}
#invF button{transition:transform .2s var(--spring),box-shadow .2s}
#invF button:not(:disabled){box-shadow:0 0 20px -8px #3ddc84}
#list,#sL,.mi{scrollbar-width:thin;scrollbar-color:#2a2a3a transparent}
.row{border:1px solid var(--line);border-left:3px solid var(--c);border-radius:18px;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 9%,#0d0d13),#09090d 60%);box-shadow:inset 0 1px 0 rgba(255,255,255,.03);transition:transform .3s var(--ease),box-shadow .3s}
.row:hover{transform:translateX(3px);box-shadow:0 0 26px -12px var(--c)}
.dexC{background:linear-gradient(120deg,color-mix(in srgb,var(--c) 8%,#0d0d13),#09090d 60%);border-color:var(--line);border-left-color:var(--c);transition:transform .3s var(--ease)}
.dexC.miss{background:#0b0b0d}
.ach,.stR{background:var(--glass);border-color:var(--line);transition:transform .3s var(--ease),box-shadow .3s}
.ach.got{background:linear-gradient(145deg,rgba(255,176,32,.13),rgba(10,9,7,.95));border-color:rgba(255,176,32,.42)}
.stR:hover,.ach:hover{transform:translateY(-2px)}
.progB{height:10px;box-shadow:inset 0 1px 2px rgba(0,0,0,.7)}
.progF{transition:width .9s var(--ease)}
.sf select,.sf input{border-radius:16px;background:var(--glass);border-color:var(--line);transition:border-color .25s,box-shadow .25s}
.sf select:focus,.sf input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,52,255,.22)}
#mnu.open .mi>*{animation:tileIn .65s var(--ease) backwards}
#mnu.open .mi>:nth-child(1){animation-delay:.06s}#mnu.open .mi>:nth-child(2){animation-delay:.1s}#mnu.open .mi>:nth-child(3){animation-delay:.14s}#mnu.open .mi>:nth-child(4){animation-delay:.18s}
#mnu.open .mi>:nth-child(5){animation-delay:.22s}#mnu.open .mi>:nth-child(6){animation-delay:.26s}#mnu.open .mi>:nth-child(7){animation-delay:.3s}#mnu.open .mi>:nth-child(8){animation-delay:.34s}#mnu.open .mi>:nth-child(9){animation-delay:.4s}
@keyframes tileIn{from{opacity:0;transform:translateY(24px) scale(.94)}}
#mnu.open .mi .ic{animation:bob 4.2s ease-in-out infinite}
#mnu.open .mi button:nth-child(even) .ic{animation-delay:-2.1s}
@keyframes bob{50%{transform:translateY(-3px)}}
.mi button{transition:transform .25s var(--spring),border-color .25s,box-shadow .25s}
.mi button:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--mc) 45%,transparent)}
.toast{position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(145deg,rgba(20,20,30,.93),rgba(8,8,12,.95));backdrop-filter:blur(14px);box-shadow:0 12px 30px -10px rgba(0,0,0,.85),0 0 26px -8px var(--tc),inset 0 1px 0 rgba(255,255,255,.06)}
.toast::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tc);box-shadow:0 0 12px var(--tc)}
.toast::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--tc);opacity:.55;transform-origin:left;animation:tbar 3.5s linear forwards}
@keyframes tbar{to{transform:scaleX(0)}}
@keyframes tin{from{opacity:0;transform:translateY(24px) scale(.88);filter:blur(4px)}}
.ft{letter-spacing:.04em;text-shadow:0 0 28px var(--fc),0 0 60px var(--fc)}
@keyframes ft{0%{opacity:0;transform:scale(.5) translateY(14px);filter:blur(8px)}14%{opacity:1;transform:scale(1.1);filter:blur(0)}22%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}65%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 60px)) scale(.2)}}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-5px,2px)}30%{transform:translate(5px,-3px)}45%{transform:translate(-3px,-2px)}60%{transform:translate(3px,3px)}80%{transform:translate(-1px,1px)}}
.rip{position:fixed;z-index:3;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:2px solid rgba(120,116,255,.85);box-shadow:0 0 16px rgba(56,52,255,.6);pointer-events:none;animation:rip .7s var(--ease) forwards}
@keyframes rip{from{transform:scale(.4);opacity:.9}to{transform:scale(7);opacity:0}}

/* ===== КИНО-ПОЯВЛЕНИЕ ЛЕГЕНДАРОК И МИФИКОВ ===== */
#rv{--rc:#ffb020;position:fixed;inset:0;z-index:3;display:none;opacity:0;overflow:hidden;pointer-events:none;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--rc) 20%,#000) 0,#000 72%)}
#rv.on{display:block;animation:rvIn .35s forwards}
#rv.out{animation:rvOut .6s forwards}
@keyframes rvIn{to{opacity:1}}
@keyframes rvOut{from{opacity:1}to{opacity:0}}
#rv .lb{position:absolute;left:0;right:0;height:0;background:#000;animation:lbar .7s var(--ease) forwards}
#rv .lb.t{top:0}#rv .lb.b{bottom:0}
@keyframes lbar{to{height:11vh}}
#rv .rvr{position:absolute;left:50%;top:45%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(color-mix(in srgb,var(--rc) 24%,transparent) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 42%);mask:radial-gradient(circle,#000 0,transparent 42%);opacity:0;animation:rvSpin 16s linear infinite,rvFade 2.2s ease-out forwards}
@keyframes rvSpin{to{transform:rotate(360deg)}}
@keyframes rvFade{to{opacity:.8}}
#rv .stage{position:absolute;left:50%;top:45%;width:120px;height:120px;margin:-60px 0 0 -60px}
#rv .orb{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--rc) 38%,color-mix(in srgb,var(--rc) 30%,#000) 82%);box-shadow:0 0 60px var(--rc),0 0 130px -10px var(--rc);animation:charge 1.9s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes charge{0%{transform:scale(.15);opacity:0}15%{transform:scale(1);opacity:1}30%{transform:scale(1.05) translate(-2px,1px)}45%{transform:scale(1.15) translate(3px,-2px)}60%{transform:scale(1.3) translate(-4px,3px)}75%{transform:scale(1.5) translate(5px,-4px)}90%{transform:scale(1.8) translate(-7px,5px)}100%{transform:scale(2.3);opacity:1}}
#rv .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--rc);box-shadow:0 0 14px var(--rc);opacity:0;animation:ringIn .9s ease-in infinite}
@keyframes ringIn{0%{transform:scale(5);opacity:0}70%{opacity:.85}100%{transform:scale(1);opacity:0}}
#rv .shock{position:absolute;left:50%;top:45%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid var(--rc);box-shadow:0 0 30px var(--rc),inset 0 0 20px var(--rc);opacity:0;animation:shock 1.1s var(--ease) forwards}
@keyframes shock{0%{transform:scale(.3);opacity:1}100%{transform:scale(24);opacity:0}}
#rvN{position:absolute;left:0;right:0;top:45%;margin-top:-.7em;text-align:center;white-space:nowrap;font-weight:700;font-size:clamp(20px,6.8vw,34px);letter-spacing:.03em;font-variant-numeric:tabular-nums;color:var(--rc);opacity:0}
#rvN.on{opacity:1}
#rvN b{color:#fff;font-weight:700;text-shadow:0 0 18px var(--rc),0 0 40px var(--rc)}
#rvN u{text-decoration:none;opacity:.4}
#rvN.fin{animation:finPop .6s var(--spring)}
#rvN.fin b{color:var(--rc);transition:color .5s}
@keyframes finPop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
#rvL{position:absolute;left:0;right:0;top:calc(45% + 90px);text-align:center;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#a0a0ae;padding:0 20px;line-height:1.5}
#rv.myth .orb{animation:charge 1.9s cubic-bezier(.5,0,.9,.6) forwards,hue 1.1s linear infinite}
#rv.myth .rvr{animation:rvSpin 7s linear infinite,rvFade 2.2s ease-out forwards,hue 2.4s linear infinite}
#rv.myth #rvN.fin{animation:glitch .7s steps(2) 2}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes glitch{0%{text-shadow:4px 0 #0ff,-4px 0 #f0f;transform:translateX(-4px)}50%{text-shadow:-4px 0 #0ff,4px 0 #f0f;transform:translateX(4px)}100%{text-shadow:0 0 24px var(--rc);transform:none}}

/* ===== ЗАЩИТА ОТ АВТОКЛИКЕРА ===== */
#cap{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.88);backdrop-filter:blur(10px)}
#cap.open{display:flex}
#cap .cb{width:min(100%,340px);padding:22px;border-radius:24px;border:1px solid rgba(255,61,127,.45);background:var(--glass);box-shadow:0 0 50px -12px #ff3d7f;text-align:center}
#cap h3{margin:0 0 8px;font-size:20px}
#cap p{margin:0 0 16px;color:#c4c4cc;line-height:1.5}
#cap .cg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#cap .cg button{aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:linear-gradient(145deg,#1a1a24,#0c0c12);font-size:30px}
#cap .cg button:active{border-color:#ff3d7f}
#cap .cbar{height:5px;border-radius:99px;background:#141419;margin-top:16px;overflow:hidden}
#cap .cbar i{display:block;height:100%;width:100%;background:#ff3d7f}
.mi .ic.im{width:62px;height:62px;border-radius:0;background:none;border:none;box-shadow:none}
.mi .ic img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6));pointer-events:none}
.mi button.hasimg .mt{margin-top:auto;position:relative;z-index:2;text-shadow:0 2px 10px #000,0 0 18px rgba(0,0,0,.9)}
.mi button.hasimg .arr{z-index:3}
.mi button.hasimg .mbig{position:absolute;right:-8px;top:0;width:78%;height:auto;transform:rotate(-7deg);transform-origin:60% 60%;filter:drop-shadow(0 10px 14px rgba(0,0,0,.65)) drop-shadow(0 0 24px color-mix(in srgb,var(--mc) 30%,transparent));pointer-events:none;z-index:0}
#mnu.open .mi button.hasimg .mbig{animation:floatImg 4.6s ease-in-out infinite}
@keyframes floatImg{50%{transform:rotate(-4deg) translateY(-5px)}}

/* ===== ОПТИМИЗАЦИЯ ПЛАВНОСТИ: без blur/backdrop-filter и тяжёлых анимаций, только transform/opacity ===== */
body{background-attachment:scroll}
body::after{inset:0;filter:none;animation:none}
body::before{animation:none}
main::before{filter:none;will-change:transform}
#app,.ih,#invF,#combo,.toast,#cap{backdrop-filter:none;-webkit-backdrop-filter:none}
.toast{background:#0d0d14f5}
#cap{background:rgba(0,0,0,.93)}
@keyframes ft{0%{opacity:0;transform:scale(.5) translateY(14px)}14%{opacity:1;transform:scale(1.1)}22%{transform:scale(1)}82%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@keyframes tin{from{opacity:0;transform:translateY(24px) scale(.88)}}
@keyframes menuShine{0%,70%{transform:translateX(0) rotate(25deg)}100%{transform:translateX(120px) rotate(25deg)}}
#menu:before{left:-40px;top:-8px;will-change:transform}
#fx i{box-shadow:none;will-change:transform,opacity}
.rays{width:120vmax;height:120vmax;margin:-60vmax 0 0 -60vmax;will-change:transform,opacity}
#rv .rvr,#rv.myth .rvr{width:120vmax;height:120vmax;margin:-60vmax 0 0 -60vmax;will-change:transform;animation:rvSpin 18s linear infinite,rvFade 2.2s ease-out forwards}
#rv .shock{box-shadow:none;will-change:transform,opacity}
@keyframes shock{0%{transform:scale(.3);opacity:1}100%{transform:scale(20);opacity:0}}
#mnu.open .mi .ic{animation:none}
.mi button.hasimg .mbig{filter:none;will-change:transform}
#rub.bump,#usd.bump{filter:none}
.rip{box-shadow:none}

/* ===== ИНВЕНТАРЬ: новый вид ===== */
#invTop{padding:4px 16px 8px;display:flex;flex-direction:column;gap:10px}
.ivStat .ivTxt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--dim);margin-bottom:7px}
.ivStat .ivTxt b{color:#F3F3F3;font-size:16px}
.ivStat .capBar{height:7px;margin:0}
.ivSearch{display:flex;gap:8px}
.ivSearch input,.ivSearch select{padding:11px 12px;border-radius:13px;border:1px solid #26262c;background:#0a0a0e;color:var(--ink);font:inherit;font-size:15px;min-width:0}
.ivSearch input{flex:1}

<script>
'use strict';
/* ================= ДАННЫЕ ================= */
const R=[
 {k:'common',n:'Обычный',w:60,c:'#9aa0a6',p:[120,600],s:10,xp:1},
 {k:'uncommon',n:'Необычный',w:25,c:'#3ddc84',p:[1500,8000],s:50,xp:2},
 {k:'rare',n:'Редкий',w:10,c:'#3d8bff',p:[30000,110000],s:500,xp:6},
 {k:'epic',n:'Эпический',w:4,c:'#b44dff',p:[400000,1600000],s:5000,xp:18},
 {k:'legendary',n:'Легендарный',w:1,c:'#ffb020',p:[4000000,40000000],s:50000,xp:60},
 {k:'mythic',n:'Мифический',w:0,c:'#ff3d7f',p:[150000000,600000000],s:1000000,xp:180}
];
const RM=Object.fromEntries(R.map(r=>[r.k,r]));
const F7=t=>`+7 (${t.slice(0,3)}) ${t.slice(3,6)}-${t.slice(6,8)}-${t.slice(8)}`;
const F2=p=>t=>`+${p} (${t.slice(0,2)}) ${t.slice(2,5)}-${t.slice(5,7)}-${t.slice(7)}`;
const CT={
 ru:{n:'Россия',fl:'🇷🇺',p:'7',cl:3,code:()=>'9'+nd(2),same:()=>String(ri(1,9)).repeat(3),f:F7,ops:['МТС','МегаФон','Tele2','Билайн','Yota','СберМобайл','Ростелеком','Мотив','Летай']},
 kz:{n:'Казахстан',fl:'🇰🇿',p:'7',cl:3,code:()=>pick(['700','701','702','705','707','708','747','771','775','776','777','778']),same:()=>'777',f:F7,ops:['Kcell','activ','Beeline KZ','Tele2 KZ','Altel']},
 by:{n:'Беларусь',fl:'🇧🇾',p:'375',cl:2,code:()=>pick(['25','29','33','44']),same:()=>'33',f:F2('375'),ops:['A1','МТС Беларусь','life:)']},
 ua:{n:'Украина',fl:'🇺🇦',p:'380',cl:2,code:()=>pick(['50','63','66','67','68','73','93','95','96','97','98','99']),same:()=>pick(['99','77']),f:F2('380'),ops:['Kyivstar','Vodafone UA','lifecell']},
 uz:{n:'Узбекистан',fl:'🇺🇿',p:'998',cl:2,code:()=>pick(['90','91','93','94','95','97','98','99','88','33']),same:()=>pick(['99','88','33']),f:F2('998'),ops:['Ucell','Beeline UZ','Mobiuz','UMS','Humans']},
 am:{n:'Армения',fl:'🇦🇲',p:'374',cl:2,code:()=>pick(['55','77','91','93','94','95','98','99']),same:()=>pick(['55','77']),f:F2('374'),ops:['Ucom','Viva-MTS','Team Telecom']},
 kg:{n:'Кыргызстан',fl:'🇰🇬',p:'996',cl:3,code:()=>pick(['700','701','702','705','707','708','709','755','770','990','995','997','999']),same:()=>pick(['777','555']),f:F2('996'),ops:['O!','MegaCom','Beeline KG']},
 tr:{n:'Турция',fl:'🇹🇷',p:'90',cl:3,code:()=>pick(['530','532','535','537','541','542','545','551','552','553','555','559']),same:()=>'555',f:F2('90'),ops:['Turkcell','Vodafone TR','Türk Telekom']},
 us:{n:'США',fl:'🇺🇸',p:'1',cl:3,code:()=>ri(2,9)+nd(2),same:()=>String(ri(2,9)).repeat(3),f:t=>`+1 (${t.slice(0,3)}) ${t.slice(3,6)}-${t.slice(6)}`,ops:['Verizon','AT&T','T-Mobile','Mint Mobile','Cricket','Visible','Google Fi']}
};
const CYBER=['NeoCell','Quantum Tel','VOID Mobile','Кибер-Связь','Nexus-7','Хром-Связь','Neon Ghost','Ионо-Телеком','Zero-Net','Пульсар'];
const PACKS=[{n:'Реальные',k:'real'},{n:'Кибер',k:'cyber'},{n:'Все',k:'all'}];
const opsFor=()=>{const k=PACKS[S.pack].k,o=CT[S.cty].ops;return k==='real'?o:k==='cyber'?CYBER:o.concat(CYBER)};
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
const nd=n=>Array.from({length:n},()=>ri(0,9)).join('');
const code=()=>CT[S.cty].code();
const f=n=>Math.round(n).toLocaleString('ru-RU');
const fmt=t=>CT[S.cty].f(t);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ===== Классификация номеров (один номер = одна редкость и цена) ===== */
const LEG={'8005553535':'Золотой номер 8-800','8001234567':'Золотой 8-800 лесенка','9991234567':'Золотая лесенка','7770007777':'Семёрки с нулями'};
const gam=(t,d)=>[...t].every((c,i)=>i===0||(+c-+t[i-1]+10)%10===d);
const asc=s=>[...s].every((c,i)=>i===0||+c===+s[i-1]+1);
const desc=s=>[...s].every((c,i)=>i===0||+c===+s[i-1]-1);
const pairs2=s=>{for(let i=0;i+3<s.length;i++)if(s[i]===s[i+1]&&s[i+2]===s[i+3]&&s[i]!==s[i+2])return true;return false};
const per=(t,p)=>t.length>p&&[...t].every((c,i)=>i<p||c===t[i-p]);
function beauty(t){
  let sc=0,run=1,mx=1,ar=1,amx=1,dr=1,dmx=1;
  for(let i=1;i<t.length;i++){
    if(t[i]===t[i-1]){run++;mx=Math.max(mx,run)}else run=1;
    if(+t[i]===+t[i-1]+1){ar++;amx=Math.max(amx,ar)}else ar=1;
    if(+t[i]===+t[i-1]-1){dr++;dmx=Math.max(dmx,dr)}else dr=1;
  }
  sc+=[0,0,4,12,25,40,60,80,90,95,100][Math.min(mx,10)];
  const cnt={};for(const c of t)cnt[c]=(cnt[c]||0)+1;
  sc+=Object.values(cnt).filter(v=>v===2).length*6;
  sc+=Math.max(0,Math.max(amx,dmx)-2)*8;
  let mir=0;for(let i=0;i<t.length/2;i++)if(t[i]===t[t.length-1-i])mir++;
  sc+=mir*7;
  const s7=t.match(/7+$/);if(s7)sc+=Math.min(3,s7[0].length)*5;
  if(/0{2,}$/.test(t))sc+=8;
  // узоры, которых не видно по подряд идущим цифрам: зеркало, повтор блока, полная гамма
  const h7=t.slice(-7);
  if(t===[...t].reverse().join(''))sc+=45;
  else if(h7===[...h7].reverse().join(''))sc+=25;

  if(!audioOK)return null;
  if(!AC){
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      // общая цепочка: компрессор (чтобы наложение звуков не хрипело) и мастер-громкость
      const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;
      master=AC.createGain();master.gain.value=1.6*(typeof S.vol==='number'?S.vol:1);
      master.connect(comp);comp.connect(AC.destination);
    }catch(e){AC=null;return null}
  }
  if(AC.state!=='running'){try{AC.resume()}catch(e){}}
  return AC;
}
// вернулись на вкладку или в приложение — звук мог быть приостановлен системой
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&AC&&AC.state!=='running'){try{AC.resume()}catch(e){}}});
window.addEventListener('focus',()=>{if(AC&&AC.state!=='running'){try{AC.resume()}catch(e){}}});
function tone(fr,d,type,v,when,slide){
  if(!S.snd)return;const c=ac();if(!c)return;
  const play=()=>{
    try{
      const t=c.currentTime+(when||0),o=c.createOscillator(),g=c.createGain(),vv=v||.06;
      o.type=type||'square';o.frequency.setValueAtTime(fr,t);
      if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
      // короткая атака убирает щелчок в начале звука, затем плавное затухание
      g.gain.setValueAtTime(.0001,t);
      g.gain.linearRampToValueAtTime(vv,t+Math.min(.008,d/3));
      g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g);g.connect(master||c.destination);o.start(t);o.stop(t+d+.03);
    }catch(e){}
  };
  if(c.state==='running')play();
  else{try{c.resume().then(play).catch(()=>{})}catch(e){}}
}

/* ================= ТОСТЫ ================= */
function toast(html,color){
  const box=$('toasts'),el=document.createElement('div');
  el.className='toast';el.style.setProperty('--tc',color||'#3ddc84');el.innerHTML=html;
  box.appendChild(el);
  while(box.children.length>4)box.firstChild.remove();
  setTimeout(()=>el.remove(),3700);
}

const xpNeed=l=>Math.round(130*Math.pow(l,1.7));
function addXP(n){
  S.xp+=n;
  while(S.xp>=xpNeed(S.lvl)){
    S.xp-=xpNeed(S.lvl);S.lvl++;
    const rw=120*S.lvl*S.lvl;S.rub+=rw;S.stats.earned+=rw;
    toast('🎉 <b>Уровень '+S.lvl+'!</b><br>Награда: +'+f(rw)+' ₽, цены продажи +2.5%','#3834FF');
    sfx.lvl();
  }
  renderLvl();
}

const fmtM=n=>{
  const t=x=>(+x.toFixed(x>=100?0:x>=10?1:2)).toLocaleString('ru-RU');
  return n>=1e12?t(n/1e12)+' трлн':n>=1e9?t(n/1e9)+' млрд':n>=1e6?t(n/1e6)+' млн':f(n);

const FX={

/* ================= КИНО-ПОЯВЛЕНИЕ (легендарки и мифики) =================
   1) чёрные полосы + вращающиеся лучи, энергетический шар заряжается (кольца сходятся, шар трясётся)
   2) взрыв: ударные волны, вспышка, частицы
   3) номер «декодируется»: цифры крутятся и фиксируются слева направо
   4) плавный переход к карточке. У мификов: радужный шар, смена оттенков, глитч-номер. */
function cinema(s,r,cat,done){
  const rv=$('rv'),nEl=$('rvN'),lb=$('rvL'),myth=r.k==='mythic';
  rv.querySelectorAll('.shock').forEach(x=>x.remove());
  rv.style.setProperty('--rc',r.c);
  rv.className='';void rv.offsetWidth;
  rv.className='on'+(myth?' myth':'');
  nEl.className='';nEl.innerHTML='';lb.textContent='';
  setTimeout(()=>{
    for(let i=0;i<(S.q===0?2:myth?5:3);i++){const e=document.createElement('div');e.className='shock';e.style.animationDelay=(i*.14)+'s';rv.appendChild(e)}
    tierFx(r.k);sfx[r.k]();
    lb.textContent='Декодирование…';
    nEl.className='on';
    const chars=[...s.num],idxs=[];
    chars.forEach((c,i)=>{if(/\d/.test(c))idxs.push(i)});
    let lk=0,tk=0;
    const dec=setInterval(()=>{
      tk++;
      if(tk%3===0&&lk<idxs.length){lk++;tone(700+lk*70,.07,'triangle',.06)}
      let html='',di=0;
      chars.forEach(c=>{
        if(!/\d/.test(c)){html+=esc(c);return}
        html+=di<lk?`<b>${c}</b>`:`<u>${ri(0,9)}</u>`;di++;
      });
      nEl.innerHTML=html;
      if(lk>=idxs.length){
        clearInterval(dec);
        nEl.classList.add('fin');
        lb.textContent=r.n+' · '+cat;
        setTimeout(()=>{rv.classList.add('out');done();setTimeout(()=>{rv.className='';nEl.className=''},650)},950);
      }
    },40);
  },350);
}

function makeDrop(silent){
  let r=roll();
  if(r.k==='legendary'&&Math.random()<.12+.02*S.up.myth)r=RM.mythic;
  const genRes=gen(r),t=genRes[0],cat=genRes[1];
  const ops=opsFor();
  const crit=Math.random()<.03;
  const s={id:++S.n,op:pick(ops),num:fmt(t),c:S.cty,cat,r:r.k,price:crit?price(r,t)*10:price(r,t),crit:crit?1:0,bt:beauty(t)};
  S.stats.drops++;
  if(crit)S.stats.crits++;
  if(s.price>S.stats.best)S.stats.best=s.price;
  S.dex[cat]=(S.dex[cat]||0)+1;
  addXP(r.xp);
  const idx=R.findIndex(x=>x.k===r.k);
  if(idx>=2){S.combo++;if(S.combo>S.stats.bestCombo)S.stats.bestCombo=S.combo}else S.combo=0;
  if(r.k==='rare')S.stats.rare++;
  if(r.k==='epic')S.stats.epic++;
  if(r.k==='legendary')S.stats.leg++;
  if(r.k==='mythic')S.stats.myth++;
  const top=r.k==='legendary'||r.k==='mythic';
  if(top&&!S.leg.includes(S.cty+t))S.leg.push(S.cty+t);
  let note;
  const hc=conHit(t,cat,S.cty),auto=autoSells(r.k);
  if(hc&&auto){
    note=conPay(hc);if(!silent)sfx.ach();
  }else if(auto){
    const g=Math.round(s.price*mult()*comboMult()*(typeof hotK==='function'?hotK(s.c):1));
    S.rub+=g;S.stats.earned+=g;
    note='Автопродажа: +'+f(g)+' ₽';
    if(!silent)sfx.coin();
  }else{
    S.inv.push(s);note='Добавлено в инвентарь';
    if(r.k==='epic'&&Math.random()<.4){S.usd+=1;note+=', +1 $'}
    if(r.k==='legendary'){S.usd+=2;note+=', +2 $'}
    if(r.k==='mythic'){S.usd+=10;note+=', +10 $'}
  }
  if(hc&&!auto)note+=' · 📜 подходит под контракт!';
  return{s,r,cat,note};
}

function shopHTML(){
  const C=CT[shopC];
  return `<div class="sf"><select id="nc">${Object.entries(CT).map(([k,c])=>`<option value="${k}"${k===shopC?' selected':''}>${c.fl} ${c.n}</option>`).join('')}</select><select id="no">${C.ops.map(o=>`<option>${esc(o)}</option>`).join('')}</select><input id="nn" inputmode="numeric" autocomplete="off" maxlength="${C.cl+7}" placeholder="Номер цифрами, ${C.cl+7} цифр"><div id="nr"></div><p class="hint">🏪 Магазин нужен для коллекции и альбома. Купленные номера продаются за <b style="color:#ff9f1c">70% цены покупки</b>, без бонусов прокачки, и не принимаются в контракты и на аукцион</p></div>`;
}
function shopUpd(){
  const C=CT[shopC],L=C.cl+7,inp=$('nn'),box=$('nr');
  if(!inp||!box)return;
  const t=inp.value;
  if(t.length<L){box.innerHTML=`<p class="hint">Введите номер целиком, осталось цифр: ${L-t.length}<br>Формат: ${esc(C.f('X'.repeat(L)))}</p>`;return}
  const cls=classify(t,C.cl),k=cls[0],cat=cls[1],r=RM[k],cost=buyCost(k,t,C.cl);
  const own=S.inv.some(x=>(x.c||'ru')===shopC&&digits(x)===t);
  box.innerHTML=`<div class="row" style="--c:${r.c}"><div><div class="rn">${esc(C.f(t))}</div><div class="rs">${C.fl} ${esc($('no').value)}, ${esc(cat)} · красота <span class="bStar">${bStars(beauty(t))}</span> ${beauty(t)}</div><div class="rs">Оценка: ${esc(appraise(t,C.cl).tags.slice(0,3).join(' · ')||'ничего особенного')}</div><div class="rp">${r.n}, ${own?'уже в вашем инвентаре':f(cost)+' ₽'}</div></div><button id="nbuy" data-cur="rub" data-need="${cost}"${own?' data-max="1" disabled':S.rub>=cost?'':' disabled'}>Купить</button></div>`;
}
function buyNum(){
  const C=CT[shopC],inp=$('nn');if(!inp)return;
  const t=inp.value;if(t.length!==C.cl+7)return;
  const cls=classify(t,C.cl),k=cls[0],cost=buyCost(k,t,C.cl);
  if(S.rub<cost||S.inv.some(x=>(x.c||'ru')===shopC&&digits(x)===t)){sfx.err();return}
  if(S.inv.length>=invCap()){toast('📦 Инвентарь полон!<br>Продайте номера или расширьте место в улучшениях','#ff3d7f');sfx.err();return}
  S.rub-=cost;S.stats.bought++;
  S.inv.push({id:++S.n,op:$('no').value,num:C.f(t),c:shopC,cat:cls[1],r:k,price:price(RM[k],t,C.cl),crit:0,b:1,paid:cost});
  if((k==='legendary'||k==='mythic')&&!S.leg.includes(shopC+t))S.leg.push(shopC+t);
  S.dex[cls[1]]=(S.dex[cls[1]]||0)+1;
  inp.value='';renderBal();shopUpd();save();sfx.buy();
  $('nr').insertAdjacentHTML('afterbegin','<p class="hint" style="color:#3ddc84">Куплено, номер в инвентаре</p>');
  checkAch();
}

      CATS.map(c=>{
        const n=S.dex[c]||0;
        let col='#555';

      }).join('');

      return `<div class="ach${got?' got':''}"><div class="an">${got?'🏆':'🔒'} ${a.n}</div><div class="ad">${a.d}</div><div class="ar">${rwT}</div></div>`;
    }).join('')+'</div>';
    return;
  }

<script>
'use strict';
/* ================= ЗАЩИТА ОТ АВТОКЛИКЕРА =================
   • синтетические клики (el.click(), dispatchEvent) — isTrusted=false — игнорируются
   • темп быстрее ~4 нажатий/с физически не проходит (лишние клики игнорируются)
   • анализ ритма: слишком ровные интервалы или одна и та же точка при высоком темпе → проверка
   • случайная проверка «вы человек?» каждые 120–220 ручных нажатий
   • провал/таймаут проверки → блокировка ручной генерации, срок растёт с каждой ошибкой */
const G={t:[],xy:[],last:0,lock:0,fails:0,since:0,next:ri(120,220),cap:0,tm:0,tg:''};
const CAPS=['🍀','🔥','⭐','💎','🚀','🎲','🌙','⚡'];
function guardClick(e){
  const n=Date.now();
  if(!e.isTrusted||G.cap)return false;
  if(n<G.lock){toast('🚫 Подозрительная активность.<br>Подождите '+Math.ceil((G.lock-n)/1000)+' с','#ff3d7f');return false}
  if(n-G.last<230)return false;
  G.last=n;G.t.push(n);G.xy.push([e.clientX,e.clientY]);G.since++;
  if(G.t.length>14){G.t.shift();G.xy.shift()}
  let sus=false;
  if(G.t.length>=10){
    const iv=[];for(let i=1;i<G.t.length;i++)iv.push(G.t[i]-G.t[i-1]);
    const m=iv.reduce((a,b)=>a+b,0)/iv.length,sd=Math.sqrt(iv.reduce((a,b)=>a+(b-m)*(b-m),0)/iv.length);
    const same=G.xy.every(p=>Math.abs(p[0]-G.xy[0][0])<=1&&Math.abs(p[1]-G.xy[0][1])<=1);
    sus=sd<15||(same&&m<400)||(m<250&&sd<40);
  }
  if(sus||G.since>=G.next){showCap(sus);return false}
  return true;
}
function showCap(sus){
  G.t=[];G.xy=[];G.since=0;G.next=ri(120,220);G.cap=1;
  const tg=pick(CAPS),o=[tg];
  while(o.length<6){const c=pick(CAPS);if(!o.includes(c))o.push(c)}
  o.sort(()=>Math.random()-.5);G.tg=tg;
  $('capT').innerHTML=(sus?'Слишком ровный ритм нажатий. ':'Быстрая проверка. ')+'Нажмите на <b style="font-size:26px">'+tg+'</b>';
  $('capG').innerHTML=o.map(c=>`<button data-c="${c}">${c}</button>`).join('');
  const bar=$('capB');bar.style.transition='none';bar.style.width='100%';void bar.offsetWidth;
  bar.style.transition='width 12s linear';bar.style.width='0';
  $('cap').classList.add('open');
  clearTimeout(G.tm);G.tm=setTimeout(()=>capEnd(false),12000);
}
function capEnd(ok){
  clearTimeout(G.tm);$('cap').classList.remove('open');G.cap=0;
  if(ok){G.fails=0;toast('✅ Проверка пройдена','#3ddc84');sfx.buy()}
  else{
    G.fails++;const sec=Math.min(120,20*G.fails);
    G.lock=Date.now()+sec*1000;
    toast('🚫 Проверка не пройдена.<br>Ручная генерация заблокирована на '+sec+' с','#ff3d7f');sfx.err();
  }
}

<script>
'use strict';
/* ================= АУКЦИОН И КОНТРАКТЫ ================= */
['aucWon','conDone'].forEach(k=>{if(typeof S.stats[k]!=='number')S.stats[k]=0});
if(!Array.isArray(S.auc))S.auc=[];
if(!Array.isArray(S.con))S.con=[];
if(typeof S.conT!=='number')S.conT=0;
TITLES.auc='Аукцион';TITLES.con='Контракты';
ACH.push(
 {id:'auc1',n:'Под молоток',d:'Продайте номер на аукционе',t:()=>S.stats.aucWon>=1,rw:{rub:8000}},
 {id:'auc10',n:'Аукционист',d:'Продайте 10 лотов на аукционе',t:()=>S.stats.aucWon>=10,rw:{rub:120000,usd:3}},
 {id:'con1',n:'Исполнитель',d:'Выполните первый контракт',t:()=>S.stats.conDone>=1,rw:{rub:10000}},
 {id:'con10',n:'Надёжный поставщик',d:'Выполните 10 контрактов',t:()=>S.stats.conDone>=10,rw:{rub:250000,usd:5}}
);

/* ---------- АУКЦИОН ----------
   При выставлении лота сразу рассчитывается расписание ставок ботов (поэтому торги идут и пока вы офлайн).
   Потолок цены = оценка × случайный «ажиотаж» × красота × спрос рынка. Ставки растут шагами 4–14%.
   Высокий старт → итог выше, но риск, что никто не поставит. */
const AUC_D=60,AUC_FEE=.05,AUC_MAX=3,AUC_M=[.6,1,1.5],AUC_N=['Низкая','Рыночная','Высокая'];
const BOTN=['Alex_Vip','NumberHunter','СимКоллектор','GoldDigit','Мария К.','Dealer777','Kolya_Opt','Ghost_Bid','НомерКлуб','Rich_Tim'];
let aucM=1;
/* оценка лота = цена номера из инвентаря × постоянные бонусы прокачки/уровня (без временного комбо), поэтому не расходится с тем, что видно в инвентаре */
function aucVal(s){return s.b?shopVal(s):Math.max(10,Math.round(s.price*mult()))}
const AUC_CAPK=2.2; // ни одна ставка бота не может превысить оценку больше чем в 2,2 раза
const mkDem=()=>1+.18*Math.sin(Date.now()/420000);
function mkBids(v,st,bt){
  const cap=Math.min(v*AUC_CAPK,v*(.95+Math.random()*.9)*(1+bt/500)*mkDem()),bids=[];
  if(st>cap)return bids;
  const ts=Array.from({length:ri(5,12)},()=>ri(2,AUC_D-3)).sort((a,b)=>a-b);
  let p=st,lw='';
  const who=()=>{let w;do{w=pick(BOTN)}while(w===lw);lw=w;return w};
  for(const t of ts){
    if(bids.length)p=Math.round(p*(1.04+Math.random()*.1)/10)*10;
    if(p>cap)break;
    bids.push({t,a:p,w:who()});
  }
  if(bids.length&&Math.random()<.4){
    const q=Math.round(bids[bids.length-1].a*1.1/10)*10;
    if(q<=cap*1.1&&q<=v*AUC_CAPK)bids.push({t:AUC_D-1,a:q,w:who()});
  }
  return bids;
}
function lotCur(l){
  const el=(Date.now()-l.t0)/1000;let b=null,n=0;
  for(const x of l.bids)if(x.t<=el){b=x;n++}
  return{b,n};
}
function aucList(id){
  if(S.auc.length>=AUC_MAX){toast('Максимум лотов одновременно: '+AUC_MAX,'#ff3d7f');sfx.err();return}
  const i=S.inv.findIndex(s=>s.id==id);if(i<0)return;
  const s=S.inv[i];if(s.b){toast('Номера из магазина на аукцион не принимаются','#ff3d7f');sfx.err();return}
  const v=aucVal(s),st=Math.max(10,Math.round(v*aucM/10)*10);
  S.inv.splice(i,1);sel.delete(String(s.id));
  const bt=s.bt!==undefined?s.bt:50;
  S.auc.push({id:++S.n,s,v,st,t0:Date.now(),end:Date.now()+AUC_D*1000,bids:mkBids(v,st,bt)});
  toast('🔨 Лот выставлен: <b>'+esc(s.num)+'</b><br>Старт '+f(st)+' ₽','#ff9f1c');sfx.buy();
  renderInv();renderScr();save();
}
function aucCancel(id){
  const i=S.auc.findIndex(l=>l.id==id);if(i<0)return;
  const l=S.auc[i];
  if(lotCur(l).b){toast('Уже есть ставки — лот снять нельзя','#ff3d7f');sfx.err();return}

const CON_T=[

}

      col:o.base<75000?'#3ddc84':o.base<3e5?'#3d8bff':o.base<3e6?'#b44dff':'#ffb020'};

}

$('sL').addEventListener('click',e=>{

  if(a==='rub+'){const x=num();S.rub+=x;msg='+'+f(x)+' ₽'}

  else if(a==='usd1e3'){S.usd+=1000;msg='+1 000 $'}

  else if(a==='upmax'){UP.forEach(u=>{S.up[u.k]=u.max});msg='Все улучшения на максимуме'}
  else if(a==='upzero'){UP.forEach(u=>{S.up[u.k]=0});msg='Улучшения сброшены'}
  else if(a.startsWith('g:')){const p=a.split(':'),got=dvGive(p[1],+p[2]);msg='Выдано: '+got+' × '+RM[p[1]].n+(got<+p[2]?' (инвентарь полон)':'')}

  else if(a==='combo'){S.combo=50;renderCombo();msg='Комбо ×50'}
  else if(a==='devoff'){S.dev=0;save();renderMenu();shut('scr');toast('Меню разработчика выключено','#9aa0a6');return}
  renderBal();renderInv();renderLvl();checkAch();save();renderScr();
  toast('🛠️ '+msg,'#ff4d6d');sfx.coin();
});

<script>
/* ===== визуальные эффекты (на логику не влияют) ===== */
(function(){try{
  const g=id=>document.getElementById(id);
  ['rub','usd'].forEach(id=>{
    const el=g(id);if(!el)return;let last=0;
    new MutationObserver(()=>{const n=Date.now();if(n-last<700)return;last=n;el.classList.add('bump');setTimeout(()=>el.classList.remove('bump'),260)})
      .observe(el,{childList:true,characterData:true,subtree:true});
  });
  const card=g('card'),main=document.querySelector('main'),cl=v=>Math.max(-.5,Math.min(.5,v));
  const flat=()=>{card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg')};
  let tp=null,raf=0;
  main.addEventListener('pointermove',e=>{
    tp=e;if(raf)return;
    raf=requestAnimationFrame(()=>{
      raf=0;const r=card.getBoundingClientRect();if(!r.width||!tp)return;
      card.style.setProperty('--ry',(cl((tp.clientX-r.left)/r.width-.5)*16).toFixed(1)+'deg');
      card.style.setProperty('--rx',(-cl((tp.clientY-r.top)/r.height-.5)*16).toFixed(1)+'deg');
    });
  });
  ['pointerleave','pointercancel'].forEach(t=>main.addEventListener(t,flat));
  main.addEventListener('pointerup',()=>setTimeout(flat,350));
  document.addEventListener('pointerdown',e=>{
    if(!e.target.closest('#app')||panelOpen()||e.target.closest('button,aside,input,select'))return;
    const s=document.createElement('span');s.className='rip';
    s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';
    document.body.appendChild(s);setTimeout(()=>s.remove(),750);
  },{passive:true});
}catch(e){}})();
</script>
<script>

 {id:'cty5',n:'Путешественник',d:'Откройте по 5+ категорий в 5 странах',t:()=>Object.keys(CT).filter(k=>Object.keys((S.alb||{})[k]||{}).length>=5).length>=5,rw:{usd:5}},
 {id:'alb20',n:'Страница альбома',d:'Соберите 20 категорий в одной стране',t:()=>Object.values(S.alb||{}).some(a=>Object.keys(a).length>=20),rw:{usd:10}},
 {id:'gen3',n:'Квантовый бизнес',d:'Купите Квантовый кластер',t:()=>!!(S.gens&&S.gens[3]),rw:{usd:15}},

 {id:'ovr',n:'Ва-банк',d:'Получите мифик в OVERDRIVE',t:()=>!!S.ovM,rw:{usd:100}});
